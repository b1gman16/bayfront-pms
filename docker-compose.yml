# Same file works on an on-premise mini-PC or a cloud VPS.
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: bayfront
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bayfront
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
volumes:
  pgdata:
